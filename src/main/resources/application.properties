spring.application.name=UpJasperReport6To7

# 批次來源：LANDWEBAP 模板目錄（唯讀）
upj.source-dir=../LANDWEBAP/src/main/webapp/WEB-INF
# dry-run 時不寫檔；正式寫 .jasper 的鏡像輸出目錄（相對本專案）
upj.out-dir=out-jasper
# true = 原地替換 .jrxml 旁邊的 .jasper；false = 寫到 out-dir 鏡像目錄
upj.in-place=false
# true = 只驗證不寫檔
upj.dry-run=true
upj.report-file=recompile-report.json
upj.auto-run=true
