spring.application.name=UpJasperReport6To7
# π 的前五碼；避開 Vite 開發埠 5173，正式 Web UI 預設埠
server.port=31415

# 批次來源：LANDWEBAP 模板目錄（唯讀）
upj.source-dir=../LANDWEBAP/src/main/webapp/WEB-INF
# dry-run 時不寫檔；正式寫 .jasper 的鏡像輸出目錄（相對本專案）；空值 = 寫到來源資料夾（與 .jrxml 同位置）
# Web UI 表單預填刻意留空（預設 = 來源同位置）；此值供 CLI 批次使用
upj.out-dir=out-jasper
# true = 原地替換 .jrxml 旁邊的 .jasper；false = 寫到 out-dir 鏡像目錄
upj.in-place=false
# true = 只驗證不寫檔
upj.dry-run=true
upj.report-file=recompile-report.json
# 服務模式預設不自動跑批次（Web UI 手動觸發）；CLI 批次加 --spring.profiles.active=cli
upj.auto-run=false
# 瀏覽器關閉監控：N 秒無 /api 活動（＝瀏覽器已關/無回應）→ 自動停止 Spring Boot；0 = 停用自動停止
# （前端 pagehide sendBeacon /api/close 會立即停；此為強殺瀏覽器的安全網）
upj.idle-shutdown-seconds=180
