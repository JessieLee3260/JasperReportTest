net.sf.jasperreports.extension.jackson.mapping.Code128B=net.sf.jasperreports.barbecue.StandardBarbecueComponent
net.sf.jasperreports.extension.jackson.mapping.Code128C=net.sf.jasperreports.barbecue.StandardBarbecueComponent
net.sf.jasperreports.extension.jackson.mapping.EAN13=net.sf.jasperreports.barbecue.StandardBarbecueComponent
