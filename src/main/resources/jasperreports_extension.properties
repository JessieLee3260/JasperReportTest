# UpJasperReport6To7：JR7 jackson XML 多態型別註冊
# 核心 jar 沒有註冊 jackson.mapping 的 registry factory，這裡補上；
# barcode 元件（jasperreports-barbecue）的元件名稱（Code39/Code128/...）
# 不在核心已知型別中，必須逐一註冊 StandardBarbecueComponent，
# 否則轉譯出的 <component kind="Code39"> jackson 解碼失敗。
net.sf.jasperreports.extension.registry.factory.jackson.mapping=net.sf.jasperreports.jackson.util.JacksonMappingExtensionsRegistryFactory

net.sf.jasperreports.extension.jackson.mapping.Code39=net.sf.jasperreports.barbecue.StandardBarbecueComponent
net.sf.jasperreports.extension.jackson.mapping.Code39Extended=net.sf.jasperreports.barbecue.StandardBarbecueComponent
net.sf.jasperreports.extension.jackson.mapping.Code128=net.sf.jasperreports.barbecue.StandardBarbecueComponent
